[package]
name = "webots-mcp-host"
version = "0.1.0"
edition = "2021"
description = "MCP (stdio) host that owns the Webots process and simulation clock and bridges to the Supervisor over IPC"

[dependencies]
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
opt-level = 3
